name: Latency regression (host only)
on: [push, pull_request]
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: python3 tests/check_geometry_original.py
      - run: python3 tests/check_geometry_navigation.py
      - run: python3 tests/check_geometry_ux.py
      - run: python3 tests/check_joystick_diagnostic.py
      - run: python3 tests/check_three_modes_60s.py
      - run: python3 tests/check_stereo_ship_vrbox.py
      - run: python3 tests/test_stereo_source_parser.py
      - run: node tools/assets/generate_stereo_video_map.js --check
      - run: dotnet run --project tests/LatencyRegression
      - run: dotnet run --project tests/ReceiverRegression
      - run: dotnet run --project tests/AndroidDownloadsRegression
      - run: dotnet run --project tests/DashUiRegression
      - run: dotnet run --project tests/LiftCycle
      - run: dotnet run --project tests/JumpControl
      - run: dotnet run --project tests/CooldownRegression
      - run: python3 tests/JumpControl/compare_cooldowns.py
      - run: dotnet run --project tests/PhaseAudit
      - run: dotnet run --project tests/RawRegression
      - run: dotnet run --project tests/BmdRegression
      - run: dotnet run --project tests/ArchiveRecovery096
      - run: python3 tests/check_android_export.py
  geometry-csharp-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet run --project tests/GeometryUxSyntax

  geometry-windows-compat:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Prepare original assets and overlays with Windows PowerShell
        shell: powershell
        run: |
          .\tools\prepare_geometry_original.ps1
          if ($LASTEXITCODE -ne 0) { throw "Compatibility preparation failed" }
      - name: Re-run compatibility patch (must be idempotent)
        shell: powershell
        run: |
          .\tools\apply_geometry_compat.ps1
          if ($LASTEXITCODE -ne 0) { throw "Compatibility patch rerun failed" }
      - name: Verify user-asset installer PowerShell syntax (no private PNGs in CI)
        shell: powershell
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path (Get-Location) 'tools/install_biofit_ui.ps1'),
            [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_.ToString() }
            throw 'The BIOFIT UI asset installer contains PowerShell syntax errors'
          }
          Write-Host 'PASS PowerShell syntax: user-provided PNG auto-install tool'
      - name: Check real Windows workspace after compatibility patches
        shell: powershell
        run: |
          $root = 'Assets/GeomeTryOriginal/Assets'
          if (!(Test-Path "$root/Scenes/Level.unity")) { throw 'Original scene absent' }
          if (Test-Path 'Assets/GeomeTryOriginal/ProjectSettings') { throw 'Nested ProjectSettings imported' }
          if (Test-Path "$root/Scripts/Camera.cs") { throw 'Old conflicting Camera script still present' }
          if (!(Test-Path "$root/Scripts/GeometryCamera.cs.meta")) { throw 'Camera GUID lost' }
          $dev = Get-Content -Raw "$root/Scripts/DevUtils.cs"
          $manager = Get-Content -Raw "$root/Scripts/UIManager.cs"
          if (!$dev.Contains('BIOFIT_BACKGROUND_RESOURCE_FIX') -or $dev.Contains('string folderPath = "Assets/Resources/UI/Backgrounds"')) { throw 'DevUtils background path not repaired' }
          if (!$manager.Contains('BIOFIT_CANVAS_LOAD_RACE_FIX') -or $manager.Contains('Debug.LogError("Canvas introuvable')) { throw 'UIManager transient Canvas error not repaired' }
          $orb = Get-Content -Raw "$root/Scripts/JumpOrb.cs"
          if (!$orb.Contains('BiofitGeomeTryLegacyBridge.TryConsumeOrbPulse()')) { throw 'BLE orb input absent' }
          if (!$orb.Contains('12.5f') -or !$orb.Contains('20.0f') -or !$orb.Contains('27.0f')) { throw 'Orb forces altered' }
          $selection = Get-Content -Raw "$root/Scripts/LevelSelectionManager.cs"
          if (!$selection.Contains('Resources.LoadAll<TextAsset>("maps/BASE")')) { throw 'Level selection path wrong' }
          foreach ($f in @(
            "$root/Resources/Sprites/Character/Ship/Ship.png",
            "$root/Resources/Sprites/Character/Wave/Wave001.png",
            "$root/Resources/Sprites/Obstacles/Tile/smallTile.png"
          )) {
            $b = [System.IO.File]::ReadAllBytes((Resolve-Path $f))
            if ($b.Length -lt 8 -or $b[0] -ne 137 -or $b[1] -ne 80 -or $b[2] -ne 78 -or $b[3] -ne 71) {
              throw "Not a valid PNG signature: $f"
            }
          }
          $original = git -C ThirdParty/GeomeTryOriginal rev-parse HEAD
          if ($original.Trim() -ne 'd922caddb4d21ecb791a266143e279bdb969d42c') { throw 'Upstream changed' }
          Write-Host 'PASS Windows compatibility: original scenes, PNG, Camera, levels, input-orbs'

  android-export-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile export Activity against Android SDK (not an APK)
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35'
          javac -Xlint:all -classpath "$ANDROID_HOME/platforms/android-35/android.jar" -d /tmp/biofit-java Assets/Plugins/Android/BiofitExport.androidlib/src/main/java/com/biofit/export/CsvExportActivity.java
          test -s /tmp/biofit-java/com/biofit/export/CsvExportActivity.class
          javap -classpath /tmp/biofit-java com.biofit.export.CsvExportActivity
          javac -Xlint:deprecation -classpath "$ANDROID_HOME/platforms/android-35/android.jar" -d /tmp/biofit-java tests/Export096/UnityPlayer.java Assets/BIOFIT/AndroidPlugins/BiofitExportBridge.java
          test -s /tmp/biofit-java/com/biofit/game/BiofitExportBridge.class

  phase-firmware-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: LucianoRodriguezUrquiza/BIOFIT-GAME-Firmware
          ref: 9cb5b7ac06315b0b657a33b8e608aca335eccb9e
          path: firmware-reference
      - run: python3 tests/PhaseAudit/replay_firmware.py firmware-reference
